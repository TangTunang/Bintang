<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas 4 - JavaScript</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header img {
            width: 100px;
            height: 100px;
            object-fit: cover;
        }

        label {
            display: inline-block;
            width: 130px;
        }

        input[type="text"],
        input[type="number"],
        input[type="email"],
        select {
            padding: 5px;
            margin-bottom: 8px;
        }

        button {
            padding: 5px 15px;
            cursor: pointer;
        }

        #pilihanForm,
        #pilihanHasil,
        #emailForm,
        #hasil {
            margin-top: 20px;
        }

        .radio-item {
            margin: 8px 0;
        }

        hr {
            margin-top: 25px;
        }
    </style>
</head>
<body>

    <header>
        <h2>Bintang Taruna Putra Syahel</h2>
        <p>NIM: 255314119</p>
        <img src="Bintang.jpg" alt="Foto">
    </header>

    <hr>

    <div id="dataAwal">
        <label>Nama :</label>
        <input type="text" id="nama">
        <br>

        <label>Jumlah Pilihan :</label>
        <input type="number" id="jumlah" min="1" max="10">
        <br>

        <button onclick="buatInput()">OK</button>
    </div>

    <div id="pilihanForm"></div>

    <div id="pilihanHasil"></div>

    <div id="emailForm"></div>

    <div id="hasil"></div>

    <script src="script.js"></script>

</body>
</html>
